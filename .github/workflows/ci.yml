
name: RAG CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy

      - name: Check Python syntax
        run: |
          python -m compileall -q src/rag scripts frontend

      - name: Lint with Ruff
        run: |
          python -m ruff check src/rag scripts frontend tests

      - name: Check formatting with Ruff
        run: |
          python -m ruff format --check src/rag scripts frontend tests

      - name: Check types with MyPy
        run: |
          python -m mypy

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=src/rag \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=report.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            report.xml
            coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [validate, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f deploy/Dockerfile \
            -t rag-api:ci .

      - name: Build frontend image
        run: |
          docker build \
            -f deploy/Dockerfile.frontend \
            -t rag-frontend:ci .
